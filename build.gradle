plugins {
    id 'org.springframework.boot' version '2.7.18'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'java'
    id 'war'
}

group = 'com.eseict'
version = '0.0.1-SNAPSHOT'
description = 'dst'
java.sourceCompatibility = JavaVersion.VERSION_17

repositories {
    maven {
        url 'http://210.97.42.250:5001/nexus/content/groups/public'
        name 'esePublic'
        allowInsecureProtocol true
    }
    mavenCentral()
    mavenLocal()
    maven { url 'https://code.lds.org/nexus/content/groups/main-repo' }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    implementation 'org.mindrot:jbcrypt:0.4'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation group: 'com.eseict', name: 'common', version: '2.3.10-SNAPSHOT'
    implementation 'com.google.guava:guava:32.1.3-jre'
    implementation 'com.google.code.gson:gson:2.10.1'
    runtimeOnly 'org.postgresql:postgresql:42.7.4'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:2.7.2'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-hibernate5:2.15.3'
    implementation 'com.github.kittinunf.fuel:fuel:2.3.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
    implementation 'commons-fileupload:commons-fileupload:1.5'
    implementation 'org.apache.poi:poi:5.2.5'
    implementation 'io.netty:netty-all'
    implementation 'com.oracle.database.jdbc:ojdbc8'
    implementation fileTree(dir: 'src/main/web/WEB-INF/lib', include: ['*.jar'])
}

def webappDir = "$projectDir/src/main/web"

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ["$projectDir/src/main/resources"]
        }
    }
}

tasks.register('copyReactBuild', Copy) {
    dependsOn 'buildReact'
    from "$webappDir/build/index.html"
    into "$projectDir/src/main/resources/templates"
}

tasks.register('copyReactStatics', Copy) {
    dependsOn 'buildReact'
    from "$webappDir/build"
    into "$projectDir/src/main/resources/static"
}

processResources.dependsOn 'copyReactBuild', 'copyReactStatics'

tasks.register('buildReact', Exec) {
    dependsOn 'installReact'
    workingDir webappDir
    inputs.dir webappDir
    group = BasePlugin.BUILD_GROUP
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'npm.cmd', 'run', 'build'
    } else {
        commandLine 'npm', 'run', 'build'
    }
}

tasks.register('installReact', Exec) {
    workingDir webappDir
    inputs.dir webappDir
    group = BasePlugin.BUILD_GROUP
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'npm.cmd', 'install'
    } else {
        commandLine 'npm', 'install'
    }
}

test {
    useJUnitPlatform()
}
